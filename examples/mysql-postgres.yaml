version: 1
source:
  type: mysql
  uri: ${DESTINATION_URI}
  allow_insecure: true
  assume_utc: true # Required for timezone-free DATETIME columns.
destination: {type: postgres, uri: '${SOURCE_URI}', allow_insecure: true}
source_quiescent: true
entities:
  - {source: customers, target: public.customers_from_mysql, key: id}
