name: dbmix
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: dbmix
      POSTGRES_PASSWORD: dbmix
      POSTGRES_DB: dbmix
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmix -d dbmix"]
      interval: 2s
      timeout: 3s
      retries: 60
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: dbmix
      MYSQL_DATABASE: dbmix
      MYSQL_USER: dbmix
      MYSQL_PASSWORD: dbmix
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pdbmix --silent"]
      interval: 2s
      timeout: 3s
      retries: 90
  mongodb:
    image: mongo:8.0.13
    ports: ["127.0.0.1:57017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 60
